<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Chat Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav id="sidebar">
    <div id="tabs"></div>
    <button id="add" class="side-btn" title="Add account (Ctrl/Cmd+N)">+</button>
    <button id="theme" class="theme-btn"></button>
  </nav>
  <main id="views"></main>

  <!-- filled per account when you right-click its icon -->
  <div id="menu" class="menu hidden"></div>

  <dialog id="dlg">
    <form method="dialog">
      <h3 id="dlg-title"></h3>
      <div id="dlg-services"></div>
      <p id="dlg-text"></p>
      <input id="dlg-input" autocomplete="off" />
      <div id="dlg-colors"></div>
      <div class="dlg-actions">
        <button type="button" id="dlg-cancel">Cancel</button>
        <button value="ok" id="dlg-ok" class="primary">OK</button>
      </div>
    </form>
  </dialog>

  <script src="services.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
